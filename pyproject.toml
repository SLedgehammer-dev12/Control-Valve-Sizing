[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "control-valve-sizing"
version = "3.4.0"
description = "IEC 60534 / ISA tabanli kontrol vanasi boyutlandirma (Tkinter + FastAPI/Three.js + Streamlit)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Control Valve Sizing Team" }]
keywords = ["control valve", "sizing", "IEC 60534", "ISA", "Cv", "Kv"]
dependencies = [
    "streamlit>=1.24.0,<2.0",
    "pandas>=2.0,<3.0",
    "coolprop>=6.8,<9.0",
    "fluids>=1.0,<2.0",
    "chemicals>=1.0,<2.0",
    "fpdf2>=2.7,<3.0",
    "plotly>=5.0,<7.0",
    "pint>=0.24,<1.0",
    "iapws>=1.5,<3.0",
    "thermo>=0.6,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.27,<1.0",
    "ruff>=0.12.0",
    "mypy>=1.8.0",
]

[project.scripts]
valve-sizing-web = "app_web:main"
valve-sizing-desktop = "app_desktop:main"

[tool.setuptools]
py-modules = [
    "actuator_sizing",
    "api",
    "app_desktop",
    "app_web",
    "config",
    "datasheet_isa20",
    "fluid_properties",
    "joule_thomson",
    "multi_case",
    "packing_emissions",
    "project_io",
    "reporting",
    "safety_piping",
    "thermal_expansion",
    "trim_guidance",
    "two_phase",
    "units",
    "valve_curve",
    "valve_3d",
    "valve_noise",
    "valve_selection",
    "valve_sizing",
    "vendor_catalog",
]
packages = ["webapp"]

[tool.setuptools.package-data]
webapp = ["*.html", "*.css", "*.js", "vendor/*.js"]

[tool.ruff]
line-length = 150
target-version = "py312"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = ["vendor", "dist", "build"]

[tool.coverage.run]
source = ["."]
omit = ["test_*.py", ".pytest_cache/*", "app_desktop.py"]

[tool.coverage.report]
fail_under = 94
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["vendor", ".opencode", ".agents", "build", "dist", "node_modules"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--tb=short --strict-markers"
